[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchfea"
version = "0.1.0"
description = "3D frame structural analysis engine and benchmark environment for structural-modelling agents"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "jsonschema>=4.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
env = ["gymnasium"]
crosscheck = ["openseespy", "PyNiteFEA"]
shapes = ["openpyxl"]
dev = ["pytest"]

[project.scripts]
benchfea = "benchfea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"benchfea.schema" = ["*.json"]
"benchfea.verify" = ["*.json"]
"benchfea.bench" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: among the slowest tests of the suite (listed in tests/conftest.py). Contributors: pytest -m 'not slow' (about 2 minutes). CI and before a release: plain pytest, which runs everything.",
]
