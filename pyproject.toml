[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchfea"
version = "0.1.0"
description = "3D frame structural analysis engine and benchmark environment for structural-modelling agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["structural analysis", "frame analysis", "finite element", "benchmark", "steel design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "jsonschema>=4.18",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/mohammedbala/BenchmarkFEA"
Documentation = "https://github.com/mohammedbala/BenchmarkFEA#readme"
Issues = "https://github.com/mohammedbala/BenchmarkFEA/issues"

[project.optional-dependencies]
env = ["gymnasium"]
crosscheck = ["openseespy", "PyNiteFEA"]
shapes = ["openpyxl"]
dev = ["pytest"]

[project.scripts]
benchfea = "benchfea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"benchfea.schema" = ["*.json"]
"benchfea.verify" = ["*.json"]
"benchfea.bench" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: among the slowest tests of the suite (listed in tests/conftest.py). Contributors: pytest -m 'not slow' (about 2 minutes). CI and before a release: plain pytest, which runs everything.",
]
